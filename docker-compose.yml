version: '3.9'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: desttek-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      desttek:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  desttek:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: desttek-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./backend/.env
    volumes:
      - desttek_data:/app/data
      - ./frontend:/frontend:ro
      - ./admin:/admin:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  desttek_data:
    driver: local
